<section id="home" [style.background-image]="backgroundHome">
    <div class="container">
        <div class="row d-flex justify-content-center align-items-center">
            <div class="caption text-center">
                <h1 class="text-light pt-5 mt-5">Welcome</h1>
                <div class="mt-5">
                    <ngx-typed-js class="text-light fw-bolder shadow"
                        [strings]="['Romario.', 'Front End Developer(Angular).']" [shuffle]="false"
                        [typeSpeed]="100" [loop]="true">
                        I am <span class="typing"></span>
                    </ngx-typed-js>
                </div>
            </div>
        </div>
    </div>
</section>
